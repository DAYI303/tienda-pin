<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P!N · Marcas</title>
<style>
:root{--pink:#dd0080;--yellow:#fec532;--navy:#141c4d;--deep:#0a0038;--cream:#fbf7f0;--r:28px}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;background:var(--cream);color:var(--navy);letter-spacing:.04em;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column}
main{flex:1}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button{font:inherit;letter-spacing:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--pink);outline-offset:3px}

/* ENCABEZADO */
.top{background:var(--cream);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:12px 16px;color:var(--deep)}
.star{justify-self:start;width:56px;height:56px}
.logo{justify-self:center;width:140px;height:46px}
.slot{display:grid;place-items:center;text-align:center;width:100%;height:100%;border:2px dashed currentColor;border-radius:14px;font-size:.62rem;line-height:1.15;padding:4px;opacity:.85}
.star img,.logo img{width:100%;height:100%;object-fit:contain}
.icons{justify-self:end;display:flex;gap:14px;align-items:center}
.icons a{position:relative;width:34px;height:34px;color:var(--deep)}
.icons svg{width:100%;height:100%}
.badge{position:absolute;top:-4px;right:-6px;background:var(--pink);color:#fff;font-size:.7rem;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center}
.strip{background:var(--pink);color:var(--cream);text-align:center;font-size:.85rem;padding:9px 12px}
.strip a{font-weight:800;text-decoration:underline}

/* BANNER */
.banner{position:relative;background:var(--deep);color:var(--cream);aspect-ratio:1600/650;min-height:210px;display:grid;place-items:center;text-align:center;overflow:hidden;padding:16px}
.banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.banner .ph{position:absolute;inset:16px;border:2px dashed #fff6;border-radius:20px;display:grid;place-items:center;padding:10px;font-size:.9rem}
.chips{position:absolute;left:0;right:0;bottom:14px;z-index:2;display:flex;flex-wrap:wrap;justify-content:center;gap:8px 12px;padding:0 12px}
.chips a{background:var(--cream);color:var(--navy);font-weight:800;border-radius:24px;padding:8px 18px;font-size:.9rem}
.chips a:hover{background:var(--yellow)}

/* SECCIONES DE MARCA */
.brand{padding:48px 20px 56px;scroll-margin-top:0}
.brand.navy{background:var(--navy);color:var(--cream)}
.brand.pink{background:var(--pink);color:var(--cream)}
.brand.yellow{background:var(--yellow);color:var(--navy)}
.brand h2{text-align:center;font-size:clamp(2.4rem,9vw,4.5rem);font-weight:900;letter-spacing:.14em;margin-bottom:24px;overflow-wrap:anywhere}
.brand-img{position:relative;max-width:1180px;margin:0 auto 30px;aspect-ratio:16/5;min-height:140px;border-radius:var(--r);overflow:hidden;background:#ffffff22;border:2px dashed currentColor;display:grid;place-items:center;text-align:center;padding:10px;font-size:.9rem}
.brand-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.grid{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.card{border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;transition:transform .2s;min-width:0}
.card:hover{transform:translateY(-4px)}
.navy .card{background:var(--pink);color:var(--cream)}
.pink .card{background:var(--cream);color:var(--navy)}
.yellow .card{background:var(--navy);color:var(--cream)}
.photo{position:relative;aspect-ratio:4/5;border-radius:16px;background:#ffffff26;border:2px dashed currentColor;display:grid;place-items:center;text-align:center;font-size:.8rem;overflow:hidden;padding:8px}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.off{position:absolute;top:10px;left:10px;z-index:1;background:var(--yellow);color:var(--navy);font-weight:800;font-size:.85rem;border-radius:20px;padding:4px 12px}
.card h3{font-size:1rem;font-weight:400;overflow-wrap:anywhere}
.price{font-size:1.4rem;font-weight:800}

.btn{display:inline-block;border:0;border-radius:30px;padding:14px 28px;font-weight:800;background:var(--yellow);color:var(--navy)}
.btn.alt{background:none;border:2px solid var(--navy)}
.btn.pink{background:var(--pink);color:#fff}

/* PRODUCTO */
.wrap{padding:30px 16px 50px}
.product{max-width:1000px;margin:0 auto;padding:28px;background:#fff;border:3px solid var(--navy);border-radius:var(--r);display:grid;grid-template-columns:1.1fr 1fr;gap:32px}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gallery .photo:first-child{grid-column:1/-1}
.product .photo{background:#fec53233;color:var(--navy)}
.info h1{font-size:1.9rem;overflow-wrap:anywhere}
.info .price{font-size:2rem;color:var(--pink);margin:8px 0 14px}
.info p{line-height:1.6;margin-bottom:18px}
.sizes{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 22px}
.sizes button{border:2px solid var(--navy);background:none;color:var(--navy);border-radius:20px;padding:8px 16px;font-weight:700}
.sizes button[aria-pressed=true]{background:var(--navy);color:#fff}
.actions{display:flex;flex-wrap:wrap;gap:12px}
.msg{min-height:1.4em;margin-top:12px;font-size:.9rem}

/* CARRITO */
.cart{position:fixed;inset:0 0 0 auto;width:min(380px,100%);background:var(--cream);border-left:4px solid var(--navy);padding:20px;transform:translateX(105%);transition:transform .3s;z-index:20;overflow:auto}
.cart.open{transform:none}
.cart h2{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.cart li{list-style:none;display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #0001}
.cart li button{border:0;background:none;color:var(--pink);font-weight:700}

/* FOOTER */
footer{background:var(--deep);color:var(--cream);padding:48px 20px 24px;min-height:220px}
.fgrid{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:28px}
footer h4{color:var(--yellow);margin-bottom:10px}
footer p,footer li{line-height:1.7;list-style:none;font-size:.95rem}
footer a:hover{color:var(--yellow)}
.copy{text-align:center;font-size:.8rem;margin-top:30px;opacity:.7}

@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.fgrid{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.product{grid-template-columns:1fr;padding:18px}.grid{gap:14px}.brand{padding:36px 14px 44px}.star{width:42px;height:42px}.logo{width:100px;height:36px}.chips a{padding:6px 12px;font-size:.8rem}}
@media(max-width:480px){.fgrid{grid-template-columns:1fr}.price{font-size:1.2rem}}
@media(max-width:340px){.grid{grid-template-columns:1fr}}
</style>

<body>

      <a id="profileLink" aria-label="Mi perfil">

    </div>
  </div>

<footer>

<aside class="cart" id="cartPanel" aria-label="Carrito">

const $ = s => document.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function setLink(el, url){ if(url) el.href = url; else { el.removeAttribute("href"); el.style.cursor = "default"; } }
const findProduct = id => { for(const b of BRANDS){ const p = b.products.find(x => x.id === id); if(p) return { p, b }; } return {}; };

/* Carrito (compartido con las otras páginas mediante localStorage) */
let cart = [];
try { cart = JSON.parse(localStorage.getItem("pin-cart")) || []; } catch(e){}
function saveCart(){ try{ localStorage.setItem("pin-cart", JSON.stringify(cart)); }catch(e){} }
function renderCart(){
  $("#cartCount").textContent = cart.length;
  $("#cartEmpty").hidden = cart.length > 0;
  $("#cartItems").innerHTML = cart.map((c,i) =>
    `<li><span>${esc(c.name)}${c.size ? " · " + esc(c.size) : ""}<br>${esc(c.price)}</span><button type="button" data-rm="${i}">Quitar</button></li>`).join("");
  $("#cartTotal").textContent = cart.length ? cart.length + " producto(s)" : "";
}
const panel = $("#cartPanel");
$("#cartItems").addEventListener("click", e => { if(e.target.dataset.rm){ cart.splice(+e.target.dataset.rm,1); saveCart(); renderCart(); } });
$("#cartClose").onclick = () => panel.classList.remove("open");

function initStatic(){
  const L = CONFIG.links;
  $("#logoLink").innerHTML = CONFIG.logoImage ? `<img src="${esc(CONFIG.logoImage)}" alt="P!N">` : `<span class="slot">Tu logo<br>400×140 px</span>`;
  $("#starLink").innerHTML = CONFIG.starImage ? `<img src="${esc(CONFIG.starImage)}" alt="">` : `<span class="slot">Tu ícono<br>200×200</span>`;
  $("#logoLink").href = $("#starLink").href = L.home || "index.html";
  setLink($("#profileLink"), L.profile);
  setLink($("#moreLink"), L.offers);
  $("#checkoutLink").href = L.cart || "carrito.html";
  if(L.cart) $("#cartLink").href = L.cart;
  else $("#cartLink").addEventListener("click", e => { e.preventDefault(); panel.classList.add("open"); });

  $("#banner").insertAdjacentHTML("afterbegin", CONFIG.bannerImage
    ? `<img src="${esc(CONFIG.bannerImage)}" alt="" decoding="async">`
    : `<div class="ph">Aquí va la imagen promocional de MARCAS<br>1600 × 650 px</div>`);

  $("#chips").innerHTML = BRANDS.map(b => `<a href="${esc(b.link || "#" + b.anchor)}">${esc(b.name)}</a>`).join("");

  const nav = [["Inicio", L.home || "index.html"], ["Ofertas", L.offers], ["Marcas", L.brands || "marcas.html"]]
    .concat(BRANDS.map(b => [b.name, b.link || "#" + b.anchor]));
  $("#navList").innerHTML = nav.map(([t,u]) => `<li><a ${u ? `href="${esc(u)}"` : ""}>${esc(t)}</a></li>`).join("");

  $("#aboutText").textContent = CONFIG.about;
  const li = x => `<li><a ${x.url ? `href="${esc(x.url)}" target="_blank" rel="noopener"` : ""}>${esc(x.label)}</a></li>`;
  $("#contactList").innerHTML = CONFIG.contact.map(li).join("");
  $("#socialList").innerHTML = CONFIG.social.map(li).join("");
}

function renderBrands(){
  $("#brands").innerHTML = BRANDS.map(b => `
    <section class="brand ${b.color}" id="${esc(b.anchor)}" aria-label="${esc(b.name)}">
      <h2>${esc(b.name)}</h2>
      <div class="brand-img">${b.image ? `<img src="${esc(b.image)}" alt="${esc(b.name)}" loading="lazy" decoding="async">` : "Imagen de la marca " + esc(b.name) + "<br>1600 × 500 px"}</div>
      <div class="grid">${b.products.map(p => {
        const href = p.url || `#/producto/${encodeURIComponent(p.id)}`;
        const img = p.images[0] ? `<img src="${esc(p.images[0])}" alt="${esc(p.name)}" loading="lazy" decoding="async">` : "Foto del producto";
        return `<a class="card" href="${esc(href)}"><div class="photo">${p.discount ? `<span class="off">${esc(p.discount)}</span>` : ""}${img}</div><h3>${esc(p.name)}</h3><span class="price">${esc(p.price) || "$ Precio"}</span></a>`;
      }).join("")}</div>
    </section>`).join("");
}

function renderProduct(id){
  const { p, b } = findProduct(id);
  const view = $("#productView");
  if(!p){ view.innerHTML = `<div class="product"><div><h1>Producto no encontrado</h1><p><a class="btn" href="#">Volver a marcas</a></p></div></div>`; return; }
  const slots = [0,1,2,3].map(i => `<div class="photo">${i===0 && p.discount ? `<span class="off">${esc(p.discount)}</span>` : ""}${p.images[i] ? `<img src="${esc(p.images[i])}" alt="${esc(p.name)} ${i+1}" loading="lazy">` : "Foto " + (i+1)}</div>`).join("");
  view.innerHTML = `<div class="product">
    <div class="gallery">${slots}</div>
    <div class="info">
      <h1>${esc(p.name)}</h1>
      <div class="price">${esc(p.price) || "$ Precio"}</div>
      <p>${esc(p.desc)}</p>
      <strong>Tallas disponibles</strong>
      <div class="sizes" id="sizes">${p.sizes.map((s,i) => `<button type="button" aria-pressed="${i===0}" data-size="${esc(s)}">${esc(s)}</button>`).join("")}</div>
      <div class="actions"><button class="btn pink" type="button" id="buyBtn">Comprar</button><a class="btn alt" href="#${esc(b.anchor)}">Volver a ${esc(b.name)}</a></div>
      <p class="msg" id="buyMsg" role="status"></p>
    </div></div>`;
  let size = p.sizes[0] || "";
  $("#sizes").addEventListener("click", e => {
    const x = e.target.closest("button"); if(!x) return;
    size = x.dataset.size;
    $("#sizes").querySelectorAll("button").forEach(y => y.setAttribute("aria-pressed", y === x));
  });
  $("#buyBtn").onclick = () => {
    if(p.buyUrl){ location.href = p.buyUrl; return; }
    cart.push({ id:p.id, name:p.name, price:p.price, size, image:(p.images&&p.images[0])||"", href:"marcas.html#/producto/"+encodeURIComponent(p.id), note:p.note||"", isNew:!!p.isNew, sel:true }); saveCart(); renderCart();
    $("#buyMsg").textContent = "Agregado al carrito.";
    panel.classList.add("open");
  };
}

function route(){
  const m = location.hash.match(/^#\/producto\/(.+)$/);
  $("#list").hidden = !!m;
  $("#productView").hidden = !m;
  panel.classList.remove("open");
  if(m){ renderProduct(decodeURIComponent(m[1])); window.scrollTo(0,0); return; }
  const target = location.hash.length > 1 ? document.getElementById(location.hash.slice(1)) : null;
  setTimeout(() => target ? target.scrollIntoView() : window.scrollTo(0,0), 0);
}
window.addEventListener("hashchange", route);
window.addEventListener("storage", () => { try{ cart = JSON.parse(localStorage.getItem("pin-cart")) || []; }catch(e){} renderCart(); });

initStatic(); renderCart(); renderBrands(); route();
</script>
</body>
</html>
